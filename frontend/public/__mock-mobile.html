<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Prueba móvil S.P.D.</title>
  <script>
    // Misma origen que la app: la sesión queda disponible antes de que carguen los iframes.
    localStorage.setItem("spd.session", JSON.stringify({ name: "Prof. Prueba", userId: 1, token: "fake" }));
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; font-family: "Segoe UI", Arial, sans-serif; }
    h1 { font-size: 15px; margin: 0 0 18px; font-weight: 600; letter-spacing: .02em; }
    .row { display: flex; align-items: flex-start; gap: 28px; flex-wrap: wrap; }
    .device { display: flex; flex-direction: column; gap: 8px; }
    .label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #94a3b8; }
    .phone { background: #000; border: 10px solid #1e293b; border-radius: 40px; padding: 6px; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
    .portrait { width: 390px; height: 844px; }
    .landscape { width: 844px; height: 390px; border-radius: 26px; }
    iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 26px; background: #fff; }
  </style>
</head>
<body>
  <h1>Vista en vivo — simulación de celular</h1>
  <div class="row">
    <div class="device">
      <span class="label">Vertical 390 × 844</span>
      <div class="phone portrait" id="portrait"><iframe allow="fullscreen" src="/salas/1/en-vivo"></iframe></div>
    </div>
    <div class="device">
      <span class="label">Horizontal 844 × 390 (pantalla completa)</span>
      <div class="phone landscape" id="landscape"><iframe allow="fullscreen" src="/salas/1/en-vivo"></iframe></div>
    </div>
  </div>
</body>
</html>
